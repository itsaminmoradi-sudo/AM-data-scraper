<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Data Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a more professional look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }
    </style>
</head>
<body class="w-96 bg-[#0F172A] text-white">

    <div class="p-4">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-600">AM Data Scraper</h1>
        </header>

        <!-- Tabs -->
        <div class="flex border-b border-slate-700 mb-4">
            <button id="scrape-tab-btn" class="flex-1 py-2 text-center font-semibold text-slate-300 border-b-2 border-transparent hover:text-white hover:border-blue-500 focus:outline-none transition-colors duration-300">Scrape</button>
            <button id="media-tab-btn" class="flex-1 py-2 text-center font-semibold text-slate-300 border-b-2 border-transparent hover:text-white hover:border-blue-500 focus:outline-none transition-colors duration-300">Media</button>
            <button id="export-tab-btn" class="flex-1 py-2 text-center font-semibold text-slate-300 border-b-2 border-transparent hover:text-white hover:border-blue-500 focus:outline-none transition-colors duration-300">Export</button>
        </div>

        <!-- Scrape Tab Content -->
        <div id="scrape-tab-content" class="p-4 bg-slate-800 rounded-lg">
            <p class="text-slate-400 mb-4 text-center">Click the button below to start scraping data from the current page.</p>
            <button id="scrape-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-transform duration-200 transform hover:scale-105">
                Scrape Data
            </button>
        </div>

        <!-- Media Tab Content (Hidden by default) -->
        <div id="media-tab-content" class="hidden p-4 bg-slate-800 rounded-lg">
            <p class="text-slate-400 text-center">Media extraction features are coming soon!</p>
        </div>

        <!-- Export Tab Content (Hidden by default) -->
        <div id="export-tab-content" class="hidden p-4 bg-slate-800 rounded-lg">
            <div class="flex justify-end space-x-2 mb-4">
                <button id="download-csv-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition-transform duration-200 transform hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9 9H7v2h2v2h2v-2h2V9h-2V7H9v2z"></path></svg>
                    CSV
                </button>
                <button id="download-pdf-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition-transform duration-200 transform hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M4 2a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2H4zm5 4a1 1 0 00-1 1v2a1 1 0 001 1h2a1 1 0 001-1V7a1 1 0 00-1-1H9z"></path></svg>
                    PDF
                </button>
            </div>
            <div class="overflow-y-auto h-64 border border-slate-700 rounded-lg">
                <table id="preview-table" class="min-w-full">
                    <thead class="bg-slate-900 text-slate-300">
                        <tr>
                            <th class="py-2 px-4 text-left font-semibold">Type</th>
                            <th class="py-2 px-4 text-left font-semibold">Data</th>
                        </tr>
                    </thead>
                    <tbody class="bg-slate-800">
                        <!-- Data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="libs/jspdf.umd.min.js"></script>
    <script src="libs/jspdf.plugin.autotable.js"></script>
    <script src="popup.js"></script>
</body>
</html>
